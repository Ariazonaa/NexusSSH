# Build und Tests für die öffentliche Ausgabe (GitHub Actions, gehostete Runner).
#
# Der Rust-Kern und die plattformfreien C#-Tests laufen unter Linux; die komplette Solution (WinUI-App samt
# Rust-Kern) wird unter Windows gebaut und getestet. Der Selbsttest der Native-AOT-Fassung braucht einen
# Desktop und läuft daher nur in der internen CI, nicht hier.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: Rust-Kern (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  core:
    name: Core-Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test frontend/NexusSSH.Core.Tests/NexusSSH.Core.Tests.csproj -c Release

  windows:
    name: Solution + Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Release)
        run: dotnet build NexusSSH.slnx -c Release
      - name: Tests
        run: dotnet test --solution NexusSSH.slnx -c Release --no-build

  # Windows auf ARM: baut die ganze Solution auf einem ARM-Runner, also ohne Kreuz-Übersetzung – Kern und App
  # entstehen dort für aarch64. Noch nie gelaufen, als dieser Job dazukam (2026-10-10); solange er sich nicht
  # bewährt hat, hält er nichts auf.
  windows-arm64:
    name: Solution + Tests (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build (Release, win-arm64)
        run: dotnet build frontend/NexusSSH.App/NexusSSH.App.csproj -c Release -r win-arm64
      - name: Tests (Core)
        run: dotnet test --project frontend/NexusSSH.Core.Tests -c Release
