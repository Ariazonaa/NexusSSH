[package]
name = "nexus-plugin-example"
description = "Beispiel-Plugin für NexusSSH: Plattenbelegung des Servers, Warnung bei voller Platte"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

# cdylib: das Plugin (.wasm → .nxplugin); rlib: damit `cargo test` die Logik auf dem eigenen Rechner prüft.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexus-plugin = { path = "../plugin-sdk" }
